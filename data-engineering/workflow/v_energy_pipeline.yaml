# Workflow do Databricks: V-Energy Grid 360 (Bronze -> Silver -> Gold -> export)
# Gerado por data-engineering/workflow/criar_workflow.ipynb. Notificação de falha: configurada no workspace (e-mail fora do repositório).
resources:
  jobs:
    v_energy_pipeline:
      name: v_energy_pipeline
      description: 'Pipeline V-Energy Grid 360: Bronze -> Silver -> Gold -> export para o banco local. Agendamento mensal (dia 3, 03:00, America/Recife), pausado enquanto a base for uma extração única.
        Cada notebook para com erro se uma checagem de qualidade falhar, e as tarefas seguintes (incluindo o export) não rodam.'
      max_concurrent_runs: 1
      tags:
        projeto: v-energy-grid-360
      schedule:
        quartz_cron_expression: 0 0 3 3 * ?
        timezone_id: America/Recife
        pause_status: PAUSED
      tasks:
      - task_key: ambiente
        notebook_task:
          notebook_path: data-engineering/notebooks/00_organizacao_do_ambiente
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
      - task_key: bronze
        notebook_task:
          notebook_path: data-engineering/notebooks/01_ingestao_bronze
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: ambiente
      - task_key: silver_ucs
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_unidades_consumidoras
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: bronze
      - task_key: silver_medidores
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_medidores
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: silver_ucs
      - task_key: silver_leituras
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_leituras
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: silver_medidores
      - task_key: silver_faturas
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_faturas
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: silver_leituras
      - task_key: silver_gd
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_geracao_distribuida
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: silver_ucs
      - task_key: silver_ocorrencias
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_ocorrencias_rede
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: silver_ucs
      - task_key: silver_inspecoes
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_inspecoes
          source: GIT
        timeout_seconds: 3600
        max_retries: 1
        min_retry_interval_millis: 60000
        depends_on:
        - task_key: silver_ucs
      - task_key: silver_atendimentos
        notebook_task:
          notebook_path: data-engineering/notebooks/02_silver_atendimentos
