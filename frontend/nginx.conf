log_format ia_timing escape=json
    '{"timestamp":"$time_iso8601","route":"/api/ia/perguntar",'
    '"status":$status,"request_time":$request_time,'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS da rede Docker; resolve novamente se o backend for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /api {
        return 404;
    }

    location = /api/ia/perguntar {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # C4.1/C4.4 somam fallbacks e regenerações; 20 s é por modelo.
        proxy_read_timeout 300s;
        access_log /var/log/nginx/access.log ia_timing;
    }

    location ^~ /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
