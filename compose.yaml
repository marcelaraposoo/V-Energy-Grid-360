name: v-energy-grid-360

services:
  backend:
    # Credenciais locais são injetadas no runtime; não entram na imagem.
    env_file:
      - path: ${BACKEND_ENV_FILE:-./backend/.env}
        required: false
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATA_SOURCE: sqlite
      PROVIDER_PRIMARY_TIMEOUT_SECONDS: ${PROVIDER_PRIMARY_TIMEOUT_SECONDS:-8}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-20}
      PROVIDER_REUSE_SUCCESS: ${PROVIDER_REUSE_SUCCESS:-true}
      PROVIDER_PHASE_BUDGETS_ENABLED: ${PROVIDER_PHASE_BUDGETS_ENABLED:-true}
      PROVIDER_SQL_BUDGET_SECONDS: ${PROVIDER_SQL_BUDGET_SECONDS:-30}
      PROVIDER_SYNTHESIS_BUDGET_SECONDS: ${PROVIDER_SYNTHESIS_BUDGET_SECONDS:-20}
      SQLITE_PATH: /data/gold/gold.db
      PORTAL_DB_PATH: /data/portal/portal.db
      REDIS_URL: redis://redis:6379/0
      GOLD_DATA_VERSION: ${GOLD_DATA_VERSION:-}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      CACHE_MAX_ENTRIES_PER_SESSION: ${CACHE_MAX_ENTRIES_PER_SESSION:-100}
      CACHE_TIMEOUT_SECONDS: ${CACHE_TIMEOUT_SECONDS:-1}
      MEMORY_TTL_SECONDS: ${MEMORY_TTL_SECONDS:-86400}
      MEMORY_TIMEOUT_SECONDS: ${MEMORY_TIMEOUT_SECONDS:-1}
    expose:
      - "8000"
    volumes:
      - portal_data:/data/portal
      - type: bind
        source: ./data/gold
        target: /data/gold
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3));
          assert data.get('status') == 'ok' and data.get('data_source') == 'sqlite'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # A imagem declara VOLUME /data; tmpfs evita volume anônimo persistente.
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    # Sem porta publicada, volume ou dependência de startup do backend.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  portal_data:
