# Usar junto com compose.yaml; o snapshot fica fora dos contextos de build.
services:
  backend:
    environment:
      DATA_SOURCE: sqlite
      SQLITE_PATH: /data/gold/gold.db
      PORTAL_DB_PATH: /data/portal/portal.db
    volumes:
      - type: bind
        source: ${GOLD_DATA_DIR:-./data/gold}
        target: /data/gold
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3));
          assert data.get('status') == 'ok' and data.get('data_source') == 'sqlite'
