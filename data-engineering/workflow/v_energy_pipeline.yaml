        - task_key: gold_consumo_faturamento
        - task_key: gold_atendimento
        - task_key: gold_interrupcao
        - task_key: gold_troca_medidor
        - task_key: gold_receita_decomposicao
        - task_key: gold_kpis_mensal
        - task_key: gold_dec_fec
        - task_key: gold_fila_inspecao
        - task_key: gold_segmento_mensal
      git_source:
        git_url: https://github.com/marcelaraposoo/V-Energy-Grid-360
        git_provider: gitHub
        git_branch: main
